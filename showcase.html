<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض حكاية وورق</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#fffaf1;
font-family:"Tajawal",sans-serif;
}

/* =========================
الموقع الحقيقي
========================= */

#website{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
background:#fffaf1;
z-index:1;
}

/* =========================
طبقة العرض فقط
========================= */

#demoLayer{
position:fixed;
inset:0;
z-index:999999;
pointer-events:none;
}

/* =========================
شريط 60 ثانية
========================= */

.timebar{
position:absolute;
top:0;
left:0;
right:0;
height:4px;
background:rgba(255,255,255,.55);
overflow:hidden;
}

#timeFill{
width:0%;
height:100%;
background:#c96f7c;
box-shadow:0 0 15px rgba(201,111,124,.45);
}

/* =========================
شرح الحركة
========================= */

#message{
position:absolute;
left:50%;
bottom:25px;

transform:
translateX(-50%)
translateY(20px);

min-width:190px;
max-width:calc(100% - 30px);

padding:12px 21px;

background:rgba(74,53,59,.94);
color:#fff;

border:1px solid rgba(255,255,255,.12);

border-radius:100px;

box-shadow:
0 14px 40px rgba(57,36,42,.22);

backdrop-filter:blur(12px);

text-align:center;

font-size:12px;
font-weight:800;

opacity:0;

transition:
opacity .25s ease,
transform .25s ease;
}

#message.show{
opacity:1;

transform:
translateX(-50%)
translateY(0);
}

/* =========================
السهم الطويل
========================= */

#arrow{
position:absolute;

width:44px;
height:145px;

opacity:0;

transform-origin:50% 100%;

transition:
left .42s cubic-bezier(.2,.8,.2,1),
top .42s cubic-bezier(.2,.8,.2,1),
opacity .18s ease;
}

#arrow.show{
opacity:1;
}

/* خط السهم */

.arrow-line{
position:absolute;

left:50%;
top:0;

width:4px;
height:calc(100% - 19px);

transform:translateX(-50%);

border-radius:20px;

background:
linear-gradient(
to bottom,
rgba(201,111,124,.05),
#c96f7c 24%,
#c96f7c 100%
);

box-shadow:
0 0 9px rgba(201,111,124,.25);
}

/* رأس السهم */

.arrow-head{
position:absolute;

left:50%;
bottom:3px;

width:20px;
height:20px;

border-right:5px solid #c96f7c;
border-bottom:5px solid #c96f7c;

border-radius:2px;

transform:
translateX(-50%)
rotate(45deg);
}

/* =========================
دائرة الهدف
========================= */

#target{
position:absolute;

width:14px;
height:14px;

border-radius:50%;

background:#c96f7c;

transform:
translate(-50%,-50%)
scale(.6);

box-shadow:
0 0 0 7px rgba(201,111,124,.18),
0 0 0 14px rgba(201,111,124,.07);

opacity:0;

transition:
left .42s cubic-bezier(.2,.8,.2,1),
top .42s cubic-bezier(.2,.8,.2,1),
opacity .18s ease,
transform .18s ease;
}

#target.show{
opacity:1;

transform:
translate(-50%,-50%)
scale(1);
}

/* =========================
تأثير الضغط
========================= */

#clickPulse{
position:absolute;

width:18px;
height:18px;

border:3px solid #c96f7c;
border-radius:50%;

transform:
translate(-50%,-50%)
scale(.3);

opacity:0;
}

#clickPulse.run{
animation:pulseClick .55s ease-out;
}

@keyframes pulseClick{

0%{
opacity:1;

transform:
translate(-50%,-50%)
scale(.3);
}

100%{
opacity:0;

transform:
translate(-50%,-50%)
scale(4);
}

}

/* =========================
شاشة البداية
========================= */

#intro{
position:absolute;
inset:0;

display:flex;
align-items:center;
justify-content:center;

background:#ea929d;

z-index:50;

opacity:1;
visibility:visible;

transition:
opacity .65s ease,
visibility .65s ease;
}

#intro.hide{
opacity:0;
visibility:hidden;
}

.intro-content{
text-align:center;
color:white;
padding:30px;
}

.intro-content small{
display:block;

direction:ltr;

font-size:8px;
font-weight:900;

letter-spacing:5px;

margin-bottom:12px;
}

.intro-content h1{
font-size:clamp(42px,9vw,78px);
font-weight:900;
line-height:1.15;
}

.intro-content p{
margin-top:12px;

font-size:12px;
font-weight:700;

opacity:.92;
}

.intro-mark{
width:55px;
height:3px;

margin:22px auto 0;

background:white;

border-radius:100px;
}

/* =========================
شاشة النهاية
========================= */

#ending{
position:absolute;
inset:0;

display:flex;
align-items:center;
justify-content:center;

background:#ea929d;
color:white;

z-index:60;

opacity:0;
visibility:hidden;

transition:
opacity .65s ease,
visibility .65s ease;
}

#ending.show{
opacity:1;
visibility:visible;
}

.end-content{
text-align:center;
padding:30px;
}

.end-content small{
display:block;

direction:ltr;

font-size:8px;
font-weight:900;

letter-spacing:5px;

margin-bottom:12px;
}

.end-content h2{
font-size:clamp(37px,8vw,67px);
font-weight:900;
}

.end-content p{
margin-top:10px;

font-size:12px;
font-weight:700;

opacity:.92;
}

/* =========================
موبايل
========================= */

@media(max-width:600px){

#message{
bottom:16px;
font-size:10px;
padding:10px 16px;
}

#arrow{
height:115px;
}

}

</style>
</head>

<body>

<!-- نفس صفحات موقع الزبون -->
<iframe
id="website"
src="./index.html"
title="حكاية وورق">
</iframe>


<div id="demoLayer">

<div class="timebar">
<div id="timeFill"></div>
</div>

<div id="arrow">
<div class="arrow-line"></div>
<div class="arrow-head"></div>
</div>

<div id="target"></div>

<div id="clickPulse"></div>

<div id="message"></div>


<div id="intro">

<div class="intro-content">

<small>
HIKAYA & WARAQ
</small>

<h1>
حكاية وورق
</h1>

<p>
جولة داخل تجربة المتجر
</p>

<div class="intro-mark"></div>

</div>

</div>


<div id="ending">

<div class="end-content">

<small>
HIKAYA & WARAQ
</small>

<h2>
من الاختيار إلى الطلب
</h2>

<p>
تجربة متجر متكاملة وبسيطة للزبون
</p>

</div>

</div>

</div>


<script>

/* ==================================================
العناصر
================================================== */

const frame =
document.getElementById("website");

const arrow =
document.getElementById("arrow");

const target =
document.getElementById("target");

const pulse =
document.getElementById("clickPulse");

const message =
document.getElementById("message");

const intro =
document.getElementById("intro");

const ending =
document.getElementById("ending");

const timeFill =
document.getElementById("timeFill");


const sleep = ms =>
new Promise(resolve => setTimeout(resolve,ms));


let showcaseStart = 0;


/* ==================================================
الوصول للموقع
================================================== */

function page(){

try{

return frame.contentDocument ||
frame.contentWindow.document;

}catch(error){

return null;

}

}


/* ==================================================
انتظار تحميل صفحة
================================================== */

function waitForLoad(){

return new Promise(resolve=>{

let finished = false;

const complete = ()=>{

if(finished) return;

finished = true;

setTimeout(resolve,350);

};

frame.addEventListener(
"load",
complete,
{once:true}
);

setTimeout(
complete,
5000
);

});

}


/* ==================================================
فتح صفحة
================================================== */

async function go(url){

hidePointer();
hideMessage();

const loading =
waitForLoad();

frame.src = url;

await loading;

}


/* ==================================================
البحث عن عنصر
================================================== */

async function getElement(
selector,
timeout = 3500
){

const start =
Date.now();

while(
Date.now() - start < timeout
){

try{

const documentInside =
page();

if(documentInside){

const element =
documentInside.querySelector(
selector
);

if(element){
return element;
}

}

}catch(error){}

await sleep(80);

}

return null;

}


/* ==================================================
النص
================================================== */

function showMessage(text){

message.textContent = text;

message.classList.add("show");

}


function hideMessage(){

message.classList.remove("show");

}


/* ==================================================
إخفاء السهم
================================================== */

function hidePointer(){

arrow.classList.remove("show");

target.classList.remove("show");

}


/* ==================================================
تمرير للعنصر
================================================== */

async function reveal(element){

if(!element) return;

try{

element.scrollIntoView({
behavior:"smooth",
block:"center",
inline:"center"
});

}catch(error){}

await sleep(600);

}


/* ==================================================
حساب موقع العنصر
================================================== */

function elementPosition(element){

const rect =
element.getBoundingClientRect();

const frameRect =
frame.getBoundingClientRect();

return {

x:
frameRect.left +
rect.left +
rect.width / 2,

y:
frameRect.top +
rect.top +
rect.height / 2

};

}


/* ==================================================
السهم الطويل
================================================== */

async function point(
element,
text
){

if(!element) return;

await reveal(element);

if(text){
showMessage(text);
}

await sleep(150);

const position =
elementPosition(element);

/*
طول السهم
*/

let arrowHeight = 145;

if(window.innerWidth < 600){
arrowHeight = 110;
}

/*
إذا كان العنصر قريب من أعلى الشاشة
نصغر السهم
*/

if(position.y < 180){
arrowHeight = 75;
}


arrow.style.height =
arrowHeight + "px";


arrow.style.left =
(position.x - 22) + "px";


arrow.style.top =
Math.max(
8,
position.y -
arrowHeight -
15
) + "px";


target.style.left =
position.x + "px";

target.style.top =
position.y + "px";


arrow.classList.add("show");

target.classList.add("show");


await sleep(650);

}


/* ==================================================
تأثير الضغطة
================================================== */

async function clickAnimation(
element
){

if(!element) return;

const position =
elementPosition(element);


pulse.style.left =
position.x + "px";

pulse.style.top =
position.y + "px";


pulse.classList.remove("run");

void pulse.offsetWidth;

pulse.classList.add("run");


try{

element.animate(

[
{
transform:"scale(1)"
},

{
transform:"scale(.93)"
},

{
transform:"scale(1)"
}
],

{
duration:300,
easing:"ease-out"
}

);

}catch(error){}


await sleep(300);

}


/* ==================================================
الضغط على عنصر
================================================== */

async function press(
selector,
text,
after = 600
){

const element =
await getElement(selector);

if(!element){
return false;
}

await point(
element,
text
);

await clickAnimation(
element
);

try{
element.click();
}catch(error){}

await sleep(after);

hidePointer();

return true;

}


/* ==================================================
كتابة بيانات
================================================== */

async function fill(
selector,
value,
text
){

const element =
await getElement(selector);

if(!element) return;

await point(
element,
text
);

element.focus();

element.value = "";

/*
الكتابة سريعة حتى ما يصير العرض بطيء
*/

for(
const character of value
){

element.value += character;

element.dispatchEvent(
new Event(
"input",
{
bubbles:true
}
)
);

await sleep(22);

}

await sleep(120);

hidePointer();
}


/* ==================================================
اختيار المحافظة
================================================== */

async function selectValue(
selector,
value,
text
){

const element =
await getElement(selector);

if(!element) return;

await point(
element,
text
);

await clickAnimation(
element
);

element.value = value;

element.dispatchEvent(
new Event(
"change",
{
bubbles:true
}
)
);

await sleep(200);

hidePointer();

}


/* ==================================================
تمرير الصفحة
================================================== */

async function pageScroll(
amount,
text,
wait = 850
){

showMessage(text);

try{

frame.contentWindow.scrollTo({
top:amount,
behavior:"smooth"
});

}catch(error){}

await sleep(wait);

hideMessage();

}


/* ==================================================
تخزين بيانات الطلب التجريبية
================================================== */

function saveCheckout(){

try{

frame.contentWindow.localStorage.setItem(

"hikayaCheckout",

JSON.stringify({

name:"سارة أحمد",

phone:"91234567",

governorate:"مسقط",

wilayat:"بوشر",

address:"الخوير",

notes:""

})

);

}catch(error){}

}


/* ==================================================
تجهيز الطلب الأخير
================================================== */

function saveLastOrder(){

try{

const storage =
frame.contentWindow.localStorage;


const cart =
JSON.parse(
storage.getItem(
"hikayaCart"
) || "[]"
);


const total =
cart.reduce(

(sum,item)=>

sum +

Number(
item.price || 0
) *

Number(
item.quantity || 1
),

0

);


storage.setItem(

"hikayaLastOrder",

JSON.stringify({

orderNumber:
"HW-" +
Date.now()
.toString()
.slice(-6),

total:total

})

);

}catch(error){}

}


/* ==================================================
انتظار توقيت محدد داخل الـ60 ثانية
================================================== */

async function waitUntil(second){

const targetTime =
showcaseStart +
(second * 1000);

const remaining =
targetTime -
performance.now();

if(remaining > 0){

await sleep(
remaining
);

}

}


/* ==================================================
الجولة الرئيسية
================================================== */

async function runShowcase(){

showcaseStart =
performance.now();


/*
تنظيف بيانات تجربة قديمة
*/

try{

const storage =
frame.contentWindow.localStorage;

storage.removeItem(
"hikayaCart"
);

storage.removeItem(
"hikayaCheckout"
);

storage.removeItem(
"hikayaLastOrder"
);

}catch(error){}


/* ========================
0 - 3
البداية
======================== */

await waitUntil(2.5);

intro.classList.add(
"hide"
);

await sleep(500);


/* ========================
3 - 9
الرئيسية
======================== */

showMessage(
"واجهة المتجر وهوية حكاية وورق"
);

await sleep(1200);

hideMessage();


await pageScroll(
500,
"تصفح سريع وواضح لأقسام المتجر",
850
);


await pageScroll(
950,
"المنتجات مرتبة لتسهيل الاختيار",
850
);


await waitUntil(9);


/* ========================
9 - 15
المتجر
======================== */

await go(
"./shop.html"
);


showMessage(
"جميع المنتجات في مكان واحد"
);

await sleep(850);

hideMessage();


const storyCategory =
await getElement(
'[data-category="stories"]'
);


if(storyCategory){

await point(
storyCategory,
"اختيار التصنيف"
);

await clickAnimation(
storyCategory
);

storyCategory.click();

await sleep(350);

hidePointer();

}


/* ========================
اختيار المنتج
======================== */

const productCard =
await getElement(
".product-art"
);


if(productCard){

await point(
productCard,
"اختيار المنتج"
);

await clickAnimation(
productCard
);

hidePointer();

}


await go(
"./product.html?id=moon-story"
);


/* ========================
15 - 24
المنتج
======================== */

showMessage(
"تفاصيل المنتج والسعر والعمر المناسب"
);

await sleep(1000);

hideMessage();


/*
زيادة الكمية
*/

const quantityButtons =
page()
? page().querySelectorAll(
".quantity button"
)
: [];


if(quantityButtons.length){

const plusButton =
quantityButtons[
quantityButtons.length - 1
];


await point(
plusButton,
"تحديد الكمية"
);

await clickAnimation(
plusButton
);

plusButton.click();

await sleep(250);

hidePointer();

}


/*
إضافة للسلة
*/

await press(
".add-cart",
"إضافة إلى السلة",
450
);


/*
السلة
*/

const cartButton =
await getElement(
'a[href="cart.html"]'
);


if(cartButton){

await point(
cartButton,
"فتح سلة التسوق"
);

await clickAnimation(
cartButton
);

hidePointer();

}


await go(
"./cart.html"
);


await waitUntil(25);


/* ========================
25 - 32
السلة
======================== */

showMessage(
"مراجعة المنتجات والكمية والإجمالي"
);

await sleep(1100);

hideMessage();


const checkoutButton =
await getElement(
".checkout"
);


if(checkoutButton){

await point(
checkoutButton,
"إكمال الطلب"
);

await clickAnimation(
checkoutButton
);

hidePointer();

}


await go(
"./checkout.html"
);


await waitUntil(32);


/* ========================
32 - 45
بيانات الطلب
======================== */

showMessage(
"إدخال بيانات التوصيل"
);

await sleep(700);

hideMessage();


await fill(
"#name",
"سارة أحمد",
"الاسم الكامل"
);


await fill(
"#phone",
"91234567",
"رقم الهاتف"
);


await selectValue(
"#governorate",
"مسقط",
"اختيار المحافظة"
);


await fill(
"#wilayat",
"بوشر",
"الولاية"
);


await fill(
"#address",
"الخوير",
"عنوان التوصيل"
);


saveCheckout();


/*
زر المتابعة للدفع
*/

let paymentButton =
await getElement(
'button[onclick*="continuePayment"]'
);


if(!paymentButton){

paymentButton =
await getElement(
".continue"
);

}


if(paymentButton){

await point(
paymentButton,
"المتابعة إلى الدفع"
);

await clickAnimation(
paymentButton
);

hidePointer();

}


await go(
"./payment.html"
);


await waitUntil(46);


/* ========================
46 - 53
الدفع
======================== */

showMessage(
"مراجعة الطلب قبل التأكيد"
);

await sleep(900);

hideMessage();


const payButton =
await getElement(
".pay"
);


if(payButton){

await point(
payButton,
"تأكيد الطلب التجريبي"
);

await clickAnimation(
payButton
);

saveLastOrder();

hidePointer();

}


await go(
"./success.html"
);


await waitUntil(53);


/* ========================
53 - 58
نجاح الطلب
======================== */

showMessage(
"تم تأكيد الطلب بنجاح"
);

await sleep(900);

hideMessage();


const tracking =
await getElement(
".tracking"
);


if(tracking){

await point(
tracking,
"حالة الطلب واضحة للزبون"
);

await sleep(950);

hidePointer();

}


hideMessage();


/*
نبقي صفحة النجاح نفسها ظاهرة
حتى قرب نهاية الدقيقة
*/

await waitUntil(58);


/* ========================
58 - 60
النهاية
======================== */

ending.classList.add(
"show"
);


await waitUntil(60);

}


/* ==================================================
شريط الوقت الحقيقي 60 ثانية
================================================== */

function runProgress(){

timeFill.animate(

[
{
width:"0%"
},

{
width:"100%"
}
],

{
duration:60000,
easing:"linear",
fill:"forwards"
}

);

}


/* ==================================================
التشغيل التلقائي
================================================== */

let started = false;


frame.addEventListener(
"load",
async ()=>{

if(started){
return;
}

started = true;

runProgress();

await runShowcase();

}
);

</script>

</body>
</html>
